specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WeightedPoolFactory
    network: swellchain-sepolia
    source:
      abi: BasePoolFactory
      address: "0x9E57809C7d9A1Cb069957656dEff4409DeAab34C"
      startBlock: 20171163
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Factory
        - Pool
      abis:
        - name: WeightedPool
          file: ./abis/WeightedPool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleWeightedPoolCreated
      file: ./src/mappings/weighted.ts
